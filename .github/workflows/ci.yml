name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run ci

  rust-audit:
    name: Rust audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Run Rust tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml

  tauri-build:
    name: Tauri build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: -- --no-default-features
          uploadWorkflowArtifacts: true

  cef-build:
    name: CEF build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
          - platform: ubuntu-24.04
            label: Linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libnss3 \
            libnspr4 \
            libgbm1 \
            libxshmfence1 \
            libxkbcommon0 \
            libatk-bridge2.0-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libcups2 \
            libpangocairo-1.0-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install macOS build tools
        if: matrix.platform == 'macos-latest'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Install Windows build tools
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install cmake ninja -y --no-progress || true

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: cef-${{ matrix.platform }}

      - name: Resolve CEF cache path
        id: cef
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CEF_DIR="${USERPROFILE}/.local/share/cef"
          else
            CEF_DIR="${HOME}/.local/share/cef"
          fi
          echo "path=${CEF_DIR}" >> "$GITHUB_OUTPUT"
          VERSION="$(awk '/name = "cef"/{getline; if ($1=="version") {gsub(/"/,"",$3); print $3; exit}}' src-tauri/Cargo.lock)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CEF_PATH=${CEF_DIR}" >> "$GITHUB_ENV"

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: ${{ steps.cef.outputs.path }}
          key: cef-${{ matrix.platform }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      - name: Ensure CEF binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${CEF_PATH}" ]] && [[ -n "$(ls -A "${CEF_PATH}" 2>/dev/null || true)" ]]; then
            echo "CEF cache hit at ${CEF_PATH}"
            exit 0
          fi
          cargo install export-cef-dir --locked
          mkdir -p "${CEF_PATH}"
          export-cef-dir --force "${CEF_PATH}"

      - name: Build with CEF feature
        shell: bash
        run: |
          set -euo pipefail
          export CEF_PATH
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export DYLD_FALLBACK_LIBRARY_PATH="${DYLD_FALLBACK_LIBRARY_PATH:-}:${CEF_PATH}:${CEF_PATH}/Chromium Embedded Framework.framework/Libraries"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:${CEF_PATH}"
          else
            export PATH="${PATH}:${CEF_PATH}"
          fi
          cargo build --features cef --manifest-path src-tauri/Cargo.toml
