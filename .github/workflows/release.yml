name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS aarch64
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            label: macOS x86_64
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-24.04
            label: Linux x86_64
            args: ''
            rust_targets: ''
          - platform: windows-latest
            label: Windows x86_64
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.platform }}-${{ matrix.rust_targets }}

      - run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 'true'
          # Optional Apple notarization / signing (set repo secrets to enable)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: pyrola v__VERSION__
          releaseBody: |
            Draft release for pyrola v__VERSION__.

            Checksums (`SHA256SUMS.txt`, `SHA512SUMS.txt`) are attached after all platform builds finish.
            See CONTRIBUTING.md for how to verify downloads.
          releaseDraft: true
          prerelease: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  checksums:
    name: Checksums and publish
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download assets and write checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pyrola-release
          cd /tmp/pyrola-release

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir . --pattern '*'

          rm -f SHA256SUMS.txt SHA512SUMS.txt

          mapfile -t files < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA512SUMS.txt' | sed 's|^\./||' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found for $TAG" >&2
            exit 1
          fi

          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha512sum -- "${files[@]}" > SHA512SUMS.txt

          {
            echo "## pyrola v${VERSION}"
            echo
            echo "Installers and bundles for macOS, Linux, and Windows are attached below."
            echo
            echo "### Verify downloads"
            echo
            echo "1. Download the asset(s) you need and \`SHA256SUMS.txt\` (or \`SHA512SUMS.txt\`)."
            echo "2. From the download directory, run:"
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS.txt'
            echo '# or'
            echo 'sha512sum -c SHA512SUMS.txt'
            echo '```'
            echo
            echo "On macOS you can use \`shasum -a 256 -c SHA256SUMS.txt\`."
            echo
            echo "Only trust checksum files from this GitHub Release for tag \`${TAG}\`."
            echo
            echo "### Assets"
            echo
            for f in "${files[@]}"; do
              echo "- \`${f}\`"
            done
          } > RELEASE_NOTES.md

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            SHA256SUMS.txt \
            SHA512SUMS.txt \
            --clobber

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file RELEASE_NOTES.md \
            --draft=false
